<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Admin Panel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 10% 20%, rgba(236, 72, 153, .25), transparent 30%),
            radial-gradient(circle at 90% 80%, rgba(244, 114, 182, .25), transparent 30%),
            linear-gradient(135deg, #fff1f7, #ffffff);
        overflow: hidden;
    }

    /* Background bubbles */
    .bubble {
        position: fixed;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .5;
        animation: float 7s ease-in-out infinite;
    }

    .bubble:nth-child(1) {
        width: 180px;
        height: 180px;
        background: #f9a8d4;
        top: -50px;
        left: -50px;
    }

    .bubble:nth-child(2) {
        width: 130px;
        height: 130px;
        background: #f472b6;
        right: 5%;
        top: 10%;
        animation-delay: 1s;
    }

    .bubble:nth-child(3) {
        width: 220px;
        height: 220px;
        background: #fbcfe8;
        bottom: -100px;
        left: 10%;
        animation-delay: 2s;
    }

    .bubble:nth-child(4) {
        width: 160px;
        height: 160px;
        background: #ec4899;
        right: -50px;
        bottom: -40px;
        animation-delay: 3s;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-25px);
        }
    }

    /* Login Card */
    .login-wrapper {
        width: 100%;
        max-width: 450px;
        padding: 20px;
        position: relative;
        z-index: 2;
    }

    .login-card {
        background: rgba(255, 255, 255, .9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, .8);
        border-radius: 28px;
        padding: 42px 38px;
        box-shadow:
            0 25px 60px rgba(190, 24, 93, .15),
            0 8px 25px rgba(0, 0, 0, .05);
        animation: cardShow .8s ease;
    }

    @keyframes cardShow {
        from {
            opacity: 0;
            transform: translateY(35px) scale(.96);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* Logo */
    .logo {
        width: 78px;
        height: 78px;
        margin: 0 auto 18px;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 34px;
        font-weight: 800;
        background: linear-gradient(135deg, #ec4899, #be185d);
        box-shadow: 0 12px 25px rgba(236, 72, 153, .35);
        animation: logoPulse 3s ease-in-out infinite;
    }

    @keyframes logoPulse {
        0%, 100% {
            transform: translateY(0);
            box-shadow: 0 12px 25px rgba(236, 72, 153, .35);
        }
        50% {
            transform: translateY(-5px);
            box-shadow: 0 18px 32px rgba(236, 72, 153, .45);
        }
    }

    .title {
        text-align: center;
        font-size: 28px;
        font-weight: 800;
        color: #18181b;
    }

    .title span {
        color: #ec4899;
    }

    .subtitle {
        text-align: center;
        margin-top: 7px;
        margin-bottom: 30px;
        color: #71717a;
        font-size: 14px;
    }

    /* Input */
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #3f3f46;
    }

    .input-box {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        color: #ec4899;
    }

    .input-box input {
        width: 100%;
        height: 52px;
        padding: 0 45px;
        border: 1.5px solid #e4e4e7;
        border-radius: 14px;
        outline: none;
        background: #fafafa;
        color: #18181b;
        font-size: 14px;
        transition: .3s;
    }

    .input-box input:focus {
        background: white;
        border-color: #ec4899;
        box-shadow: 0 0 0 4px rgba(236, 72, 153, .1);
    }

    .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        cursor: pointer;
        color: #71717a;
        font-size: 17px;
    }

    /* Remember */
    .options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0 25px;
        font-size: 12px;
    }

    .remember {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #52525b;
    }

    .remember input {
        accent-color: #ec4899;
    }

    /* Button */
    .login-button {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        color: white;
        font-size: 15px;
        font-weight: 700;
        background: linear-gradient(135deg, #ec4899, #be185d);
        box-shadow: 0 10px 25px rgba(236, 72, 153, .3);
        transition: .3s;
        position: relative;
        overflow: hidden;
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(236, 72, 153, .4);
    }

    .login-button:active {
        transform: scale(.98);
    }

    .login-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );
        transform: skewX(-20deg);
        transition: .6s;
    }

    .login-button:hover::before {
        left: 130%;
    }

    /* Error */
    .error-message {
        display: none;
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        font-size: 12px;
        text-align: center;
    }

    /* Footer */
    .footer {
        text-align: center;
        margin-top: 25px;
        color: #a1a1aa;
        font-size: 11px;
    }

    /* Loading */
    .loading {
        pointer-events: none;
        opacity: .8;
    }

    .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,.4);
        border-top-color: white;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        vertical-align: middle;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 35px 25px;
            border-radius: 23px;
        }

        .title {
            font-size: 24px;
        }
    }
</style>


</head>

<body>


<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="login-wrapper">
    <div class="login-card">

        <div class="logo">A</div>

        <h1 class="title">
            Admin <span>Panel</span>
        </h1>

        <p class="subtitle">
            Silakan masuk untuk mengelola sistem
        </p>

        <div id="errorMessage" class="error-message">
            Username atau password salah!
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <div class="input-box">
                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-box">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Ingat saya
                </label>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Masuk ke Dashboard
            </button>

        </form>

        <div class="footer">
            © 2026 Admin Panel · Secure Login
        </div>

    </div>
</div>

<script>

    // ================================
    // LOGIN ADMIN
    // ================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");

    loginForm.addEventListener("submit", function(e) {

        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        // AKUN ADMIN
        const adminUsername = "admin";
        const adminPassword = "admin123";

        errorMessage.style.display = "none";

        if (
            username === adminUsername &&
            password === adminPassword
        ) {

            // Simpan status login
            sessionStorage.setItem("adminLogin", "true");

            // Animasi tombol
            loginButton.classList.add("loading");
            loginButton.innerHTML =
                '<span class="spinner"></span> Memproses...';

            // Masuk ke dashboard
            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 700);

        } else {

            errorMessage.style.display = "block";

            loginForm.animate(
                [
                    { transform: "translateX(0)" },
                    { transform: "translateX(-8px)" },
                    { transform: "translateX(8px)" },
                    { transform: "translateX(-5px)" },
                    { transform: "translateX(5px)" },
                    { transform: "translateX(0)" }
                ],
                {
                    duration: 350
                }
            );
        }

    });


    // ================================
    // SHOW / HIDE PASSWORD
    // ================================

    function togglePassword() {

        const password = document.getElementById("password");
        const button = document.querySelector(".toggle-password");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "🙈";
        } else {
            password.type = "password";
            button.textContent = "👁";
        }
    }

</script>

</body>
</html>
